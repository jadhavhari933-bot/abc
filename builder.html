<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayMoney Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Inter, Arial, sans-serif;
  background:#f5f7fb;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.card{
  background:#ffffff;
  width:420px;
  padding:26px;
  border-radius:22px;
  box-shadow:0 18px 45px rgba(0,0,0,.15);
}

h2{
  margin:0;
  text-align:center;
  color:#0D3B66;
}

.sub{
  text-align:center;
  font-size:14px;
  color:#555;
  margin-top:6px;
}

input, textarea{
  width:100%;
  margin-top:14px;
  padding:14px;
  border-radius:12px;
  border:1px solid #ddd;
  font-size:15px;
}

textarea{
  resize:none;
}

button{
  width:100%;
  margin-top:20px;
  padding:16px;
  border:none;
  border-radius:16px;
  background:#0D3B66;
  color:#fff;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.result{
  display:none;
  margin-top:18px;
}

.link{
  font-size:13px;
  word-break:break-all;
  color:#0D3B66;
  text-decoration:underline;
  cursor:pointer;
}

.copy{
  margin-top:12px;
  background:#16a34a;
}

.copy.copied{
  background:#15803d;
}

.note{
  margin-top:14px;
  font-size:12px;
  text-align:center;
  color:#777;
}
</style>
</head>

<body>

<div class="card">
  <h2>PayMoney Builder</h2>
  <p class="sub">Create smart payment landing page link</p>

  <input id="title" placeholder="Title (eg. Online Course)">
  <textarea id="desc" rows="2" placeholder="Description"></textarea>
  <input id="amount" type="number" placeholder="Amount (₹)">
  <input id="upi" placeholder="UPI ID (example@upi)">

  <!-- IMAGE URL -->
  <input id="imageUrl" placeholder="Image URL (https://...)">

  <!-- WHATSAPP GROUP -->
  <input id="groupName" placeholder="Access Group Name (eg. VIP Learning Group)">
  <input id="groupLink" placeholder="WhatsApp Group Link (https://chat.whatsapp.com/...)">

  <button onclick="generate()">Generate Landing Page Link</button>

  <div class="result" id="result">
    <div class="link" id="finalLink" onclick="openLink()"></div>
    <button class="copy" id="copyBtn" onclick="copyLink()">Copy Link</button>
  </div>

  <div class="note">
    One link • Mobile UPI • Desktop QR • WhatsApp Group Access
  </div>
</div>

<script>
let finalURL = "";

function generate(){
  const title = encodeURIComponent(document.getElementById("title").value);
  const desc  = encodeURIComponent(document.getElementById("desc").value);
  const amt   = document.getElementById("amount").value;
  const upi   = document.getElementById("upi").value.trim();
  const img   = document.getElementById("imageUrl").value.trim();
  const gname = encodeURIComponent(document.getElementById("groupName").value);
  const glink = encodeURIComponent(document.getElementById("groupLink").value);

  if(!upi || upi.indexOf("@") === -1){
    alert("Enter valid UPI ID");
    return;
  }
  if(!amt || amt <= 0){
    alert("Enter valid amount");
    return;
  }

  finalURL =
    "https://www.paymoney24.in/lp.html" +
    "?title=" + title +
    "&desc=" + desc +
    "&amount=" + amt +
    "&upi=" + encodeURIComponent(upi) +
    "&image=" + encodeURIComponent(img) +
    "&group=" + gname +
    "&grouplink=" + glink;

  document.getElementById("finalLink").innerText = finalURL;
  document.getElementById("result").style.display = "block";

  const btn = document.getElementById("copyBtn");
  btn.innerText = "Copy Link";
  btn.classList.remove("copied");
}

function openLink(){
  window.open(finalURL, "_blank");
}

function copyLink(){
  navigator.clipboard.writeText(finalURL).then(()=>{
    const btn = document.getElementById("copyBtn");
    btn.innerText = "Copied ✓";
    btn.classList.add("copied");
  });
}
</script>

</body>
</html>
