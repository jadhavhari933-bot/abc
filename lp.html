<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pay via UPI | PayMoney</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Inter, Arial, sans-serif;
  background:#f4f6fb;
  display:flex;
  justify-content:center;
  align-items:center;
  min-height:100vh;
}

.card{
  background:#fff;
  max-width:380px;
  width:100%;
  padding:22px;
  border-radius:20px;
  box-shadow:0 20px 45px rgba(0,0,0,.15);
  text-align:center;
}

img.banner{
  width:100%;
  border-radius:14px;
  display:none;
}

h2{
  margin:14px 0 6px;
  font-size:22px;
}

p.desc{
  font-size:14px;
  color:#555;
}

.amount{
  margin:14px 0;
  font-size:26px;
  font-weight:800;
  color:#0d3b66;
}

button{
  width:100%;
  padding:16px;
  font-size:17px;
  font-weight:700;
  border:none;
  border-radius:14px;
  background:#16a34a;
  color:#fff;
  cursor:pointer;
}

.error{
  margin-top:10px;
  font-size:13px;
  color:#dc2626;
  font-weight:600;
}

#qrBox{
  display:none;
  margin-top:14px;
}

#qrBox img{
  width:220px;
}

.note{
  margin-top:10px;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<div class="card">

  <img id="img" class="banner">

  <h2 id="title">Payment</h2>
  <p class="desc" id="desc"></p>

  <div class="amount" id="amount"></div>

  <button id="payBtn">Pay Now</button>

  <div class="error">
    If UPI app does not open, please scan QR code
  </div>

  <div id="qrBox">
    <img id="qrImg">
  </div>

  <div class="note">
    Secure UPI payment powered by PayMoney
  </div>

</div>

<script>
/* 🔹 Get URL Params */
const params = new URLSearchParams(window.location.search);

const title = params.get("title") || "Payment";
const desc  = params.get("desc")  || "";
const img   = params.get("image");
const amt   = params.get("amount") || "0";
const upi   = params.get("upi");

/* 🔹 Set Content */
document.getElementById("title").innerText = title;
document.getElementById("desc").innerText  = desc;
document.getElementById("amount").innerText = "₹" + amt;

if(img){
  const imgEl = document.getElementById("img");
  imgEl.src = img;
  imgEl.style.display = "block";
}

/* 🔹 Build UPI Link */
const upiLink =
  "upi://pay?pa=" + encodeURIComponent(upi) +
  "&pn=PayMoney" +
  "&am=" + amt +
  "&cu=INR";

/* 🔹 Detect Mobile */
const isMobile =
  /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

document.getElementById("payBtn").onclick = () => {

  if(isMobile){
    // try UPI app
    window.location.href = upiLink;

    // fallback QR
    setTimeout(showQR, 1200);
  }else{
    showQR();
  }
};

/* 🔹 Show QR */
function showQR(){
  const qr =
    "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" +
    encodeURIComponent(upiLink);

  document.getElementById("qrImg").src = qr;
  document.getElementById("qrBox").style.display = "block";
}
</script>

</body>
</html>
