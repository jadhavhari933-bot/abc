<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Landing Page</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter;background:#f8fafc}
.hero{padding:40px 20px;color:#fff;text-align:center}
.box{max-width:900px;margin:auto;padding:20px}
.btn{display:block;text-align:center;padding:16px;border-radius:999px;font-weight:700;text-decoration:none;margin-top:14px}
.pay{background:#dc2626;color:#fff}
.wa{background:#22c55e;color:#000}
.card{background:#fff;padding:20px;border-radius:16px;box-shadow:0 10px 25px rgba(0,0,0,.08);margin-top:20px}
</style>
</head>
<body>

<script>
const p = new URLSearchParams(location.search);
const c = "#" + p.get("c");
const t = p.get("t");
const s = p.get("s");
const a = p.get("a");
const upi = p.get("upi");
const wa = p.get("wa");

document.write(`
<div class="hero" style="background:${c}">
<h1>${t}</h1>
<p>${s}</p>
</div>

<div class="box">
<div class="card">
<h2>Entry Fee: ₹${a}</h2>
<a class="btn pay" href="${upi}">Pay & Join</a>
<a class="btn wa" href="${wa}">Join WhatsApp Group</a>
</div>
</div>
`);
<script>
function isMobile(){
  return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

function handlePayment(){
  const upi = "${upiLink}";

  if(isMobile()){
    // 📱 Mobile → Direct UPI app
    window.location.href = upi;
  } else {
    // 💻 Desktop → Show QR
    const qrUrl =
      "https://api.qrserver.com/v1/create-qr-code/?size=260x260&data=" +
      encodeURIComponent(upi);

    const qrWindow = window.open("", "_blank");
    qrWindow.document.write(`
      <html>
      <head>
        <title>Scan to Pay</title>
        <style>
          body{
            font-family:Arial;
            text-align:center;
            padding:40px;
            background:#f8fafc;
          }
          img{border-radius:12px}
        </style>
      </head>
      <body>
        <h2>Scan QR Code to Pay</h2>
        <img src="${qrUrl}">
        <p>Use any UPI app</p>
      </body>
      </html>
    `);
  }
}
</script>


</body>
</html>
