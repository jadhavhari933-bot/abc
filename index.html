<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayMoney – Create Payment Link</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:Inter,system-ui,Arial}
body{margin:0;background:#f5f7fb}
.container{
  max-width:520px;
  margin:40px auto;
  background:#fff;
  padding:24px;
  border-radius:14px;
  box-shadow:0 20px 40px rgba(0,0,0,.08)
}
h1{margin:0 0 16px;font-size:22px}
label{display:block;margin-top:14px;font-weight:600;font-size:14px}
input,textarea{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:8px;
  border:1px solid #dbe1ea;
  font-size:14px
}
textarea{resize:vertical}
button{
  width:100%;
  margin-top:22px;
  padding:14px;
  font-size:16px;
  font-weight:700;
  border:none;
  border-radius:10px;
  cursor:pointer;
  background:linear-gradient(135deg,#4f46e5,#4338ca);
  color:#fff;
  box-shadow:0 10px 25px rgba(79,70,229,.35)
}
.note{
  margin-top:12px;
  font-size:12px;
  color:#64748b
}
</style>
</head>
<body>

<div class="container">
  <h1>Create PayMoney Link</h1>

  <label>Title *</label>
  <input id="title" placeholder="e.g. Online Workshop Fee">

  <label>Description *</label>
  <textarea id="desc" rows="3" placeholder="Short details about this payment"></textarea>

  <label>Amount (₹) *</label>
  <input id="amount" type="number" placeholder="499">

  <label>UPI ID *</label>
  <input id="upi" placeholder="yourupi@bank">

  <label>Poster / Image URL (optional)</label>
  <input id="image" placeholder="https://example.com/poster.jpg">

  <label>YouTube / Video Link (optional)</label>
  <input id="video" placeholder="https://youtube.com/watch?v=xxxx">

  <label>WhatsApp Number (optional)</label>
  <input id="whatsapp" placeholder="91XXXXXXXXXX">

  <label>WhatsApp Group Link (optional)</label>
  <input id="group" placeholder="https://chat.whatsapp.com/...">

  <button onclick="createLink()">Create Link</button>

  <div class="note">
    ✔ Mobile: direct UPI payment<br>
    ✔ Desktop: QR code auto-generate
  </div>
</div>

<script>
function createLink(){
  const params = new URLSearchParams({
    title: document.getElementById('title').value.trim(),
    desc: document.getElementById('desc').value.trim(),
    amount: document.getElementById('amount').value.trim(),
    upi: document.getElementById('upi').value.trim(),
    image: document.getElementById('image').value.trim(),
    video: document.getElementById('video').value.trim(),
    whatsapp: document.getElementById('whatsapp').value.trim(),
    group: document.getElementById('group').value.trim()
  });

  if(!params.get('title') || !params.get('desc') || !params.get('amount') || !params.get('upi')){
    alert("Please fill all required (*) fields");
    return;
  }

  const landingURL = "lp.html?" + params.toString();
  window.open(landingURL, "_blank");
}
</script>

</body>
</html>
